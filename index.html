<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL TRADING</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="rt logo.png" type="image/png">
</head>
<body>
    <!-- Project Title -->
    <div class="project-title">
        <h1>REAL TRADING</h1>
    </div>

    <div class="game-container">
        <div class="header">
            <p class="instructions">Press SPACE or ↑ to jump</p>
            <div class="score-container">PnL: $<span id="score">0</span></div>
        </div>
        <div id="game-area">
            <div id="dino"></div>
            <div id="cactus"></div>
        </div>
        <div class="controls">
            <button id="start-button">START</button>
            <button id="restart-button" style="display: none;">TRADE AGAIN</button>
            <button id="withdraw-btn" class="withdraw-btn">Withdraw</button>
        </div>
    </div>
    
    <!-- Token Info -->
    <div class="token-info">
        <div class="token-ticker">$RT</div>
        <div class="contract-address" id="contract-address" onclick="copyContract()">
            GGQqRJPUfzJY9TsSZVTjgdF8YLWXfpuoZ1fDeMWtpump
        </div>
        <a href="https://x.com/i/communities/1981723743551394053" target="_blank" class="twitter-link-inline">
            <svg class="twitter-icon-inline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="currentColor"/>
            </svg>
        </a>
    </div>
    
    
    <script src="game.js"></script>
</body>
</html>
